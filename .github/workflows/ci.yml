
name: deterministic-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.11.2

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            app guardrails evaluation judge adapters \
            tests scripts dashboard.py

      - name: Run critical static checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            app guardrails evaluation judge adapters \
            tests scripts dashboard.py

      - name: Run deterministic test suite
        env:
          LANGSMITH_TRACING: "false"
          AUDIT_DB_PATH: /tmp/guardbench-ci-audit.db
        run: |
          python -m pytest -q

      - name: Verify test suite
        if: success()
        run: echo "GuardBench CI checks passed successfully."

