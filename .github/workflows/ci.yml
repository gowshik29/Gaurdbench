name: deterministic-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.11.2
      - name: Compile Python sources
        run: python -m compileall -q app guardrails evaluation judge adapters tests scripts dashboard.py
      - name: Run critical static checks
        run: ruff check --select E9,F63,F7,F82 app guardrails evaluation judge adapters tests scripts dashboard.py
      - name: Run deterministic test suite
        run: python -m pytest -q
